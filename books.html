
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Book Information</title>
</head>
<body>
    <h1>Book Information</h1>

    <p id="firstBook"></p>
    <p id="secondAuthor"></p>

  
    <div id="genres"></div>

    <p id="error" style="color: red;"></p>

    <script>
        async function loadBooks() {
            try {
                const response = await fetch("books.json");

                if (!response.ok) {
                    throw new Error("Could not load books.json.");
                }

                const data = await response.json();

                document.getElementById("firstBook").textContent =
                    "First book title: " + data.books[0].title;

                document.getElementById("secondAuthor").textContent =
                    "Second book author: " + data.books[1].author;

                const genresDiv = document.getElementById("genres");

                data.books.forEach(function(book) {
                    const paragraph = document.createElement("p");

                    paragraph.textContent =
                        book.title + " — " + book.genres.join(", ");

                    genresDiv.appendChild(paragraph);
                });

            } catch (error) {
                document.getElementById("error").textContent =
                    "Error loading book data. Please check your files and try again.";
                console.error(error);
            }
        }

        loadBooks();
    </script>
</body>
</html>
